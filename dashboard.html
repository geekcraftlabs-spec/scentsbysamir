<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – Scents by Samir</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#2c114f">

  <style>
    body { padding: 28px; background: #0b0a12; }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }
    .dash-header h1 {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, #c084fc, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .dash-header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .dash-header-actions a {
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: 0.2s;
      padding: 6px 12px;
      border-radius: 8px;
    }
    .dash-header-actions a:hover { color: white; background: rgba(255,255,255,0.05); }
    .logout-link { color: #f87171 !important; }
    .logout-link:hover { color: #ef4444 !important; background: rgba(239,68,68,0.1) !important; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 16px 20px;
      text-align: center;
      transition: 0.3s;
    }
    .stat-card:hover { background: rgba(255,255,255,0.05); }
    .stat-card .num {
      font-size: 28px;
      font-weight: 800;
      color: var(--purple-light);
      display: block;
    }
    .stat-card .label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }
    .stat-card.pending .num { color: #f59e0b; }
    .stat-card.contacted .num { color: #3b82f6; }
    .stat-card.paid .num { color: #8b5cf6; }
    .stat-card.completed .num { color: #10b981; }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-secondary);
      padding: 8px 20px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .filter-btn:hover { border-color: var(--purple-glow); color: white; }
    .filter-btn.active {
      background: var(--purple-primary);
      border-color: var(--purple-primary);
      color: white;
      box-shadow: 0 0 20px rgba(124,58,237,0.3);
    }
    .filter-btn .count {
      background: rgba(255,255,255,0.15);
      padding: 0 8px;
      border-radius: 40px;
      font-size: 11px;
      margin-left: 4px;
    }
    .filter-btn.active .count { background: rgba(255,255,255,0.2); }

    .orders-container {
      background: rgba(255,255,255,0.02);
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.05);
      overflow: hidden;
      padding: 0 4px 4px 4px;
    }
    .dash-table-wrapper { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }
    th {
      text-align: left;
      padding: 16px 14px;
      background: rgba(124,58,237,0.06);
      color: var(--purple-light);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    td {
      padding: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: middle;
      font-size: 14px;
    }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .product-thumb {
      width: 44px;
      height: 44px;
      object-fit: contain;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 4px;
    }
    .status-badge {
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      display: inline-block;
    }
    .status-badge.pending { background: #f59e0b; color: #000; }
    .status-badge.contacted { background: #3b82f6; color: white; }
    .status-badge.paid { background: #8b5cf6; color: white; }
    .status-badge.completed { background: #10b981; color: white; }
    .make-order-btn {
      background: linear-gradient(135deg, #10b981, #34d399);
      border: none;
      color: white;
      padding: 6px 18px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(16,185,129,0.25);
      font-size: 12px;
    }
    .make-order-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 32px rgba(16,185,129,0.4);
    }
    .mark-paid-btn {
      background: linear-gradient(135deg, #8b5cf6, #a855f7);
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 12px;
      margin-right: 6px;
    }
    .mark-paid-btn:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(139,92,246,0.4); }
    .mark-completed-btn {
      background: linear-gradient(135deg, #10b981, #34d399);
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 12px;
      margin-right: 6px;
    }
    .mark-completed-btn:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(16,185,129,0.4); }
    .empty-state {
      text-align: center;
      padding: 60px 0;
      color: var(--text-secondary);
      font-size: 18px;
    }
    .db-status {
      font-size: 13px;
      padding: 4px 14px;
      border-radius: 40px;
      display: inline-block;
    }
    .db-status.connected { background: #10b981; color: white; }
    .db-status.error { background: #ef4444; color: white; }

    @media (max-width: 768px) {
      .dash-table-wrapper { display: none; }
      .orders-container { background: transparent; border: none; padding: 0; }
      .stats-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .dash-header h1 { font-size: 24px; }
    }
    .dash-cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .dash-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .dash-card .dash-card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dash-card .label {
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      flex-shrink: 0;
      margin-right: 12px;
    }
    .dash-card .value {
      font-weight: 600;
      font-size: 13px;
      text-align: right;
      word-break: break-word;
      flex: 1;
    }
    .dash-card .product-thumb {
      width: 50px;
      height: 50px;
      object-fit: contain;
      border-radius: 8px;
      background: rgba(0,0,0,0.3);
      padding: 4px;
    }
    .dash-card .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .dash-card .card-actions button {
      flex: 1;
      min-width: 60px;
      font-size: 11px;
      padding: 6px 12px;
    }
    @media (min-width: 769px) {
      .dash-cards { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ===== HEADER ===== -->
    <div class="dash-header">
      <h1>📊 Admin Dashboard</h1>
      <div class="dash-header-actions">
        <a href="index.html">← Home</a>
        <a href="#" class="logout-link" onclick="logout()">🚪 Logout</a>
        <span id="db-status" class="db-status">⏳ Connecting...</span>
      </div>
    </div>

    <!-- ===== STATS ===== -->
    <div class="stats-row" id="stats-row">
      <div class="stat-card">
        <span class="num" id="total-orders">0</span>
        <span class="label">Total Orders</span>
      </div>
      <div class="stat-card pending">
        <span class="num" id="pending-count">0</span>
        <span class="label">Pending</span>
      </div>
      <div class="stat-card contacted">
        <span class="num" id="contacted-count">0</span>
        <span class="label">Contacted</span>
      </div>
      <div class="stat-card paid">
        <span class="num" id="paid-count">0</span>
        <span class="label">Paid</span>
      </div>
      <div class="stat-card completed">
        <span class="num" id="completed-count">0</span>
        <span class="label">Completed</span>
      </div>
    </div>

    <!-- ===== FILTERS ===== -->
    <div class="filter-row" id="filter-row">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">
        All <span class="count" id="filter-all-count">0</span>
      </button>
      <button class="filter-btn" data-filter="pending" onclick="setFilter('pending')">
        ⏳ Pending <span class="count" id="filter-pending-count">0</span>
      </button>
      <button class="filter-btn" data-filter="contacted" onclick="setFilter('contacted')">
        📞 Contacted <span class="count" id="filter-contacted-count">0</span>
      </button>
      <button class="filter-btn" data-filter="paid" onclick="setFilter('paid')">
        💳 Paid <span class="count" id="filter-paid-count">0</span>
      </button>
      <button class="filter-btn" data-filter="completed" onclick="setFilter('completed')">
        ✅ Completed <span class="count" id="filter-completed-count">0</span>
      </button>
    </div>

    <!-- ===== ORDERS ===== -->
    <div class="orders-container">
      <div class="dash-table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Image</th>
              <th>Product(s)</th>
              <th>Client</th>
              <th>WhatsApp</th>
              <th>Delivery</th>
              <th>Total</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="orders-body">
            <!-- Dynamically filled -->
          </tbody>
        </table>
      </div>
      <div class="dash-cards" id="dash-cards">
        <!-- Dynamically filled -->
      </div>
    </div>
  </div>

  <script src="js/products.js"></script>
  <script>
    // ===== LOGIN CHECK =====
    if (!localStorage.getItem('admin_logged_in')) {
      window.location.href = 'login.html';
    }

    function logout() {
      localStorage.removeItem('admin_logged_in');
      window.location.href = 'login.html';
    }

    // ===== STATE =====
    let allOrders = [];
    let currentFilter = 'all';

    // ===== FETCH ORDERS FROM API =====
    function fetchOrders() {
      fetch('/api/orders', {
        headers: { 'Cache-Control': 'no-cache' }
      })
        .then(res => {
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }
          return res.json();
        })
        .then(data => {
          allOrders = data;
          document.getElementById('db-status').textContent = '✅ Connected';
          document.getElementById('db-status').className = 'db-status connected';
          updateStats();
          updateFilterCounts();
          renderOrders();
        })
        .catch(err => {
          console.error('Error fetching orders:', err);
          document.getElementById('db-status').textContent = '❌ Error: ' + err.message;
          document.getElementById('db-status').className = 'db-status error';
          allOrders = [];
          updateStats();
          updateFilterCounts();
          renderOrders();
        });
    }

    // ===== UPDATE STATS =====
    function updateStats() {
      const total = allOrders.length;
      const pending = allOrders.filter(o => o.status === 'pending').length;
      const contacted = allOrders.filter(o => o.status === 'contacted').length;
      const paid = allOrders.filter(o => o.status === 'paid').length;
      const completed = allOrders.filter(o => o.status === 'completed').length;

      document.getElementById('total-orders').textContent = total;
      document.getElementById('pending-count').textContent = pending;
      document.getElementById('contacted-count').textContent = contacted;
      document.getElementById('paid-count').textContent = paid;
      document.getElementById('completed-count').textContent = completed;
    }

    // ===== UPDATE FILTER COUNTS =====
    function updateFilterCounts() {
      document.getElementById('filter-all-count').textContent = allOrders.length;
      document.getElementById('filter-pending-count').textContent = allOrders.filter(o => o.status === 'pending').length;
      document.getElementById('filter-contacted-count').textContent = allOrders.filter(o => o.status === 'contacted').length;
      document.getElementById('filter-paid-count').textContent = allOrders.filter(o => o.status === 'paid').length;
      document.getElementById('filter-completed-count').textContent = allOrders.filter(o => o.status === 'completed').length;
    }

    // ===== SET FILTER =====
    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      renderOrders();
    }

    // ===== RENDER ORDERS =====
    function renderOrders() {
      const filtered = currentFilter === 'all'
        ? allOrders
        : allOrders.filter(o => o.status === currentFilter);

      const tbody = document.getElementById('orders-body');
      const cards = document.getElementById('dash-cards');

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="empty-state">✨ No orders in this category.</td></tr>`;
        cards.innerHTML = `<div class="empty-state">✨ No orders in this category.</div>`;
        return;
      }

      // Table rows
      tbody.innerHTML = filtered.map(order => {
        const items = order.items || [];
        const names = items.map(p => p.name).join(', ');
        const firstImg = items[0]?.image || 'placeholder.webp';

        return `
          <tr>
            <td><img src="images/products/${firstImg}" class="product-thumb" alt="product"></td>
            <td style="max-width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${names}</td>
            <td>${order.customer_name || order.customerName}</td>
            <td>${order.whatsapp}</td>
            <td>${order.delivery}</td>
            <td><strong>R${parseFloat(order.total).toFixed(2)}</strong></td>
            <td><span class="status-badge ${order.status}">${order.status}</span></td>
            <td>${getActionButtons(order)}</td>
          </tr>
        `;
      }).join('');

      // Mobile cards
      cards.innerHTML = filtered.map(order => {
        const items = order.items || [];
        const names = items.map(p => p.name).join(', ');
        const firstImg = items[0]?.image || 'placeholder.webp';

        return `
          <div class="dash-card">
            <div class="dash-card-row">
              <img src="images/products/${firstImg}" class="product-thumb" alt="product">
              <span style="font-weight:600; font-size:14px; text-align:right; flex:1;">${names}</span>
            </div>
            <div class="dash-card-row">
              <span class="label">Client</span>
              <span class="value">${order.customer_name || order.customerName}</span>
            </div>
            <div class="dash-card-row">
              <span class="label">WhatsApp</span>
              <span class="value">${order.whatsapp}</span>
            </div>
            <div class="dash-card-row">
              <span class="label">Delivery</span>
              <span class="value">${order.delivery}</span>
            </div>
            <div class="dash-card-row">
              <span class="label">Total</span>
              <span class="value" style="color:var(--purple-light);">R${parseFloat(order.total).toFixed(2)}</span>
            </div>
            <div class="dash-card-row">
              <span class="label">Status</span>
              <span class="status-badge ${order.status}">${order.status}</span>
            </div>
            <div class="card-actions">
              ${getActionButtons(order)}
            </div>
          </div>
        `;
      }).join('');
    }

    // ===== ACTION BUTTONS =====
    function getActionButtons(order) {
      let buttons = '';

      if (order.status === 'pending') {
        buttons += `<button class="mark-paid-btn" onclick="updateStatus('${order.id}', 'paid')">💳 Mark Paid</button>`;
        buttons += `<button class="make-order-btn" onclick="makeOrder('${order.id}')">📲 Contact</button>`;
      } else if (order.status === 'contacted') {
        buttons += `<button class="mark-paid-btn" onclick="updateStatus('${order.id}', 'paid')">💳 Mark Paid</button>`;
        buttons += `<button class="make-order-btn" onclick="makeOrder('${order.id}')">📲 Re-contact</button>`;
      } else if (order.status === 'paid') {
        buttons += `<button class="mark-completed-btn" onclick="updateStatus('${order.id}', 'completed')">✅ Complete</button>`;
        buttons += `<button class="make-order-btn" onclick="makeOrder('${order.id}')">📲 Re-contact</button>`;
      } else if (order.status === 'completed') {
        buttons += `<button class="make-order-btn" onclick="makeOrder('${order.id}')">📲 Re-contact</button>`;
      }

      return buttons;
    }

    // ===== UPDATE STATUS =====
    function updateStatus(orderId, newStatus) {
      fetch(`/api/orders/${orderId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          fetchOrders();
        }
      })
      .catch(err => console.error(err));
    }

    // ===== FORMAT WHATSAPP NUMBER =====
    function formatWhatsAppNumber(number) {
      let cleaned = number.replace(/[\s\-\(\)\+]/g, '');
      if (cleaned.startsWith('0')) {
        cleaned = '27' + cleaned.slice(1);
      }
      if (!cleaned.startsWith('27') && cleaned.length <= 10) {
        cleaned = '27' + cleaned;
      }
      return cleaned;
    }

    // ===== MAKE ORDER (WhatsApp) =====
    function makeOrder(orderId) {
      const order = allOrders.find(o => o.id === orderId);
      if (!order) return;

      const product = order.items?.[0];
      const baseUrl = window.location.origin;
      const productUrl = `${baseUrl}/product-detail.html?id=${product?.id || ''}`;
      const payShap = '069 566 9978';
      const itemsList = order.items?.map(p => p.name).join(' & ') || '';

      const formattedNumber = formatWhatsAppNumber(order.whatsapp);

      const message =
`${productUrl}

Hi ${order.customer_name || order.customerName}! 👋

Thank you for your order of **${itemsList}**.

💳 Please send **R${parseFloat(order.total).toFixed(2)}** via **PayShap** to:

🔹 **PayShap: ${payShap}**  
🔹 Ref: **${order.id}**

After payment, reply with proof.

We'll confirm once received.`;

      const waLink = `https://wa.me/${formattedNumber}?text=${encodeURIComponent(message)}`;
      window.open(waLink, '_blank');
    }

    // ===== INIT =====
    fetchOrders();

    // Force refresh when the tab becomes visible
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        fetchOrders();
      }
    });

    // Auto-refresh every 30 seconds
    setInterval(fetchOrders, 30000);
  </script>
</body>
</html>
