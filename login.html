<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Scents by Samir</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-container {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 32px;
      padding: 48px 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }
    .login-box h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .login-box p {
      color: var(--text-secondary);
      margin-bottom: 24px;
    }
    .login-box label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-secondary);
    }
    .login-box input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid #2a2744;
      border-radius: 14px;
      color: white;
      font-size: 15px;
      margin-bottom: 16px;
      transition: 0.3s;
    }
    .login-box input:focus {
      border-color: var(--purple-primary);
      outline: none;
      background: rgba(124,58,237,0.08);
    }
    .login-box .btn-primary {
      width: 100%;
      padding: 14px;
      font-size: 16px;
    }
    .login-error {
      color: #f87171;
      font-size: 14px;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-container">
      <div class="login-box">
        <h1>🔐 Admin Login</h1>
        <p>Enter your password to access the dashboard.</p>
        <div class="login-error" id="login-error">Invalid password. Please try again.</div>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter admin password" autofocus>
        <button class="btn-primary" onclick="login()">Login</button>
        <!-- Hint removed -->
      </div>
    </div>
  </div>
  <script>
    function login() {
      const pass = document.getElementById('password').value;
      if (pass === 'ceo@sbs') {
        localStorage.setItem('admin_logged_in', 'true');
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    }
    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
