<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c114f" />
      <stop offset="100%" stop-color="#4a1a7a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)" stroke="#c084fc" stroke-width="1.5" />
  <!-- Inner glow ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(192,132,252,0.15)" stroke-width="0.5" />
  <!-- SM letters -->
  <text x="50" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="1">SM</text>
  <!-- Subtle shine -->
  <ellipse cx="35" cy="30" rx="20" ry="10" fill="rgba(255,255,255,0.04)" transform="rotate(-30, 35, 30)" />
</svg>